<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula</title>
    <link rel="stylesheet" href="assets/css/style.css">

</head>


<body>
    <div class="top-wrapper">
        <header>
            <div class="intestazione">
                <h1>Nebula</h1>
                <p>Il tuo diario per l'osservazione del cielo.</p>
            </div>

            <label class="toggle-container">
                <input type="checkbox" id="toggle-dark">
                <span class="slider"></span>
            </label>
        </header>

        <section id="controls">
            <form>
                <input type="text" id="search" placeholder="Cerca qui un corpo celeste...">
                <select id="order">
                    <option>Ordine alfabetico crescente</option>
                    <option>Ordine alfabetico decrescente</option>
                    <option>Ordine temporale crescente</option>
                    <option>Ordine temporale crescente</option>
                </select>
            </form>
        </section>

        <div id="filter-div">
            <button type="button" id="category-all" class="selected">Tutti</button>
            <button type="button" id="category-stars">Stelle</button>
            <button type="button" id="category-satellites">Satelliti</button>
            <button type="button" id="category-galaxies">Galassie</button>
            <button type="button" id="category-nebulas">Nebulose</button>
            <button type="button" id="category-pianeta">Pianeti</button>
            <button type="button" id="category-fav">Preferiti</button>

        </div>
    </div>

    <div class="container">



        <main>

            

            <section>
                <div id="lista-corpi-celesti"></div>
                <form id="my-form"></form>

                <button type="button" class="create-form" id="create-form">
                    <span class="icon" id="add-form">+</span>
                </button>
            </section>
        </main>

        <footer>
            Francesca Morrone - 2026
        </footer>

    </div>
    <script src="assets/js/script.js"></script>
</body>

</html>
