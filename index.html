<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula</title>
    <link rel="stylesheet" href="assets/css/style.css">

</head>


<body id="body">
    <div id="notifica"></div>
    <div class="top-wrapper">
        <header>
            <div class="intestazione">
                <h1>Nebula</h1>
                <p>Il tuo diario per l'osservazione del cielo.</p>
            </div>

            <label class="toggle-container">
                <input type="checkbox" id="toggle-dark">
                <span class="slider"></span>
            </label>
        </header>

        <section id="controls">
            <form>
                <input type="text" id="search" placeholder="Cerca qui un corpo celeste...">

            </form>
        </section>

        <div id="filter-div">
            <button type="button" id="category-all" class="selected">Tutti<span id="riepilogoTutti"></span></button>
            <button type="button" id="category-stars">Stelle<span id="riepilogoStelle"></span></button>
            <button type="button" id="category-satellites">Satelliti<span id="riepilogoSatelliti"></span></button>
            <button type="button" id="category-galaxies">Galassie<span id="riepilogoGalassie"></span></button>
            <button type="button" id="category-nebulas">Nebulose<span id="riepilogoNebulose"></span></button>
            <button type="button" id="category-pianeta">Pianeti<span id="riepilogoPianeti"></span></button>
            <button type="button" id="category-fav">Preferiti<span id="riepilogoFav"></span></button>
        </div>
    </div>

    <div class="container">
        <div id="notifica"></div>


        <main>

            

            <section>
                <div id="lista-corpi-celesti"></div>
                <form id="my-form"></form>

                <button type="button" class="create-form" id="create-form">
                    <span class="icon" id="add-form">+</span>
                </button>
            </section>
        </main>

    </div>
            <footer>
            Francesca Morrone - 2026
        </footer>
    <script src="assets/js/script.js"></script>
</body>

</html>
